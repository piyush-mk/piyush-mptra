version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      all-npm: { patterns: ["*"] }
    ignore:
      # Astro's type checker targets TypeScript 6; revisit when @astrojs/check supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      all-actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Stay on Node LTS (24); odd-numbered releases are short-lived
      - dependency-name: node
        update-types: ["version-update:semver-major"]
